[package]
name = "yoke"
version = "0.1.0"
edition = "2024"
description = "LLM automation loop harness"

[[bin]]
name = "yoke"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std", "preserve_order"] }

[dev-dependencies]
tempfile = "3"
